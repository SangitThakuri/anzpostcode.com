<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B2545"/>
      <stop offset="100%" stop-color="#112d5e"/>
    </linearGradient>
    <linearGradient id="ping" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#E8472A"/>
      <stop offset="100%" stop-color="#c13820"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Accent stripe -->
  <rect x="0" y="0" width="7" height="630" fill="#E8472A"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Brand name -->
  <text x="80" y="200" font-family="system-ui,-apple-system,sans-serif" font-weight="800" font-size="76" fill="white" letter-spacing="-2">ANZ Postcode</text>

  <!-- Tagline -->
  <text x="80" y="258" font-family="system-ui,-apple-system,sans-serif" font-size="30" fill="rgba(255,255,255,0.60)">Australia &amp; New Zealand Postcode Directory</text>

  <!-- Divider -->
  <rect x="80" y="290" width="120" height="3" rx="2" fill="#E8472A"/>

  <!-- Stat cards -->
  <rect x="80" y="330" width="280" height="106" rx="16" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
  <text x="220" y="376" font-family="system-ui,sans-serif" font-weight="700" font-size="44" fill="#E8472A" text-anchor="middle">18,000+</text>
  <text x="220" y="412" font-family="system-ui,sans-serif" font-size="18" fill="rgba(255,255,255,0.50)" text-anchor="middle">AU postcodes</text>

  <rect x="392" y="330" width="240" height="106" rx="16" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
  <text x="512" y="376" font-family="system-ui,sans-serif" font-weight="700" font-size="44" fill="#2D6A4F" text-anchor="middle">150+</text>
  <text x="512" y="412" font-family="system-ui,sans-serif" font-size="18" fill="rgba(255,255,255,0.50)" text-anchor="middle">NZ postcodes</text>

  <rect x="664" y="330" width="240" height="106" rx="16" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
  <text x="784" y="376" font-family="system-ui,sans-serif" font-weight="700" font-size="44" fill="white" text-anchor="middle">Free</text>
  <text x="784" y="412" font-family="system-ui,sans-serif" font-size="18" fill="rgba(255,255,255,0.50)" text-anchor="middle">no sign-up needed</text>

  <!-- URL bar -->
  <rect x="80" y="476" width="320" height="48" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="240" y="506" font-family="system-ui,sans-serif" font-size="20" fill="rgba(255,255,255,0.45)" text-anchor="middle">anzpostcode.com</text>

  <!-- Map pin decoration (right) -->
  <circle cx="1080" cy="300" r="120" fill="rgba(232,71,42,0.06)" stroke="rgba(232,71,42,0.12)" stroke-width="1.5"/>
  <circle cx="1080" cy="300" r="80" fill="rgba(232,71,42,0.08)" stroke="rgba(232,71,42,0.15)" stroke-width="1"/>

  <!-- Pin body -->
  <ellipse cx="1080" cy="278" rx="38" ry="38" fill="#E8472A"/>
  <!-- Pin hole -->
  <circle cx="1080" cy="278" r="16" fill="white"/>
  <!-- Pin tail -->
  <path d="M1055 305 Q1080 350 1080 355 Q1080 350 1105 305 Z" fill="#E8472A"/>
</svg>
